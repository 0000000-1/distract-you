<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distract Me!</title>
    <style>
        /* Compact Base Setup */
        body {
            color: #f3f4f6;
            background-color: #0f1115;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 8px;
            width: 320px; /* Standard extension popup width */
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        /* Tight Input Container */
        #wayh-container {
            display: flex;
            gap: 6px;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Sleek Small Input */
        #wayh-site-input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #2d3139;
            background-color: #161920;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s ease;
        }

        #wayh-site-input::placeholder {
            color: #64748b;
        }

        #wayh-site-input:focus {
            background-color: #1a1e26;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
        }

        /* Compact Action Button */
        #wayh-add-btn {
            padding: 6px 12px;
            font-weight: 600;
            background-color: #ffffff;
            color: #0f1115;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 0.2px;
            transition: all 0.2s ease;
        }

        #wayh-add-btn:hover {
            background-color: #f3f4f6;
        }

        #wayh-add-btn:active {
            transform: scale(0.98);
        }

        /* Compact List Container */
        ul {
            list-style-type: none;
            padding: 0 4px;
            margin: 8px 0 0 0;
            width: 100%;
            box-sizing: border-box;
        }

        /* Small List Items with Hover State */
        ul li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #161920;
            border: 1px solid #2d3139;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #cbd5e1;
            transition: all 0.2s ease;
        }

        ul li:hover {
            border-color: #3f4452;
            background-color: #1c2029;
        }

        /* Small Remove Button with Hover State */
        ul li button {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        ul li button:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>
    <div id="wayh-container">
        <input type="text" id="wayh-site-input" placeholder="reddit.com">
        <button id="wayh-add-btn">add</button>
    </div>
    <ul id="wayh-site-list">
    </ul>
    <script src="options.js"></script>
</body>
</html>
